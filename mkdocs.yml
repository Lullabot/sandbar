site_name: sandbar
site_url: https://lullabot.github.io/sandbar/
repo_url: https://github.com/lullabot/sandbar
site_description: Disposable development VMs for coding agents, on your own machine or on a server.
docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: mkdocs-overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/palette-sync.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  - pymdownx.snippets:
      # Snippet paths are relative to the repo root (where mkdocs runs), and a
      # missing one fails the build instead of silently rendering nothing.
      base_path: ['.']
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  version:
    provider: mike
    alias: true

plugins:
  - search
  - redirects:
      redirect_maps:
        using-sand/files-and-shells.md: using-sandbar/shells.md
        using-sand/web-servers.md: using-sandbar/web-servers.md
        using-sand/secrets.md: using-sandbar/secrets.md
        using-sand/review.md: using-sandbar/review.md
        using-sand/connection-profiles.md: advanced/connection-profiles.md
        using-sand/proxmox.md: advanced/proxmox.md
        using-sand/golden-templates.md: advanced/templates.md
        using-sand/drupalorg-publishing.md: advanced/drupalorg-publishing.md
        using-sand/tui.md: reference/board.md
        using-sand/cli-reference.md: reference/cli.md
        getting-started/available-tools.md: reference/vm-tools.md
        getting-started/how-it-works.md: background/how-it-works.md
        reference/security-model.md: background/security-model.md
        why.md: background/why.md
        contributing/image-build-audit.md: contributing/base-image.md
        getting-started/index.md: getting-started/quickstart.md

nav:
  - Home: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - 'Quickstart: a Drupal site with DDEV': getting-started/quickstart.md
    - Your first VM: getting-started/first-vm.md
  - Using sandbar:
    - Shells and files: using-sandbar/shells.md
    - Web servers and ports: using-sandbar/web-servers.md
    - Secrets: using-sandbar/secrets.md
    - Reviewing changes in a browser: using-sandbar/review.md
  - Advanced setups:
    - Where VMs run: advanced/connection-profiles.md
    - Proxmox VE setup: advanced/proxmox.md
    - Golden templates: advanced/templates.md
    - Publishing to drupal.org: advanced/drupalorg-publishing.md
  - Reference:
    - Troubleshooting: reference/troubleshooting.md
    - The board (TUI): reference/board.md
    - CLI reference: reference/cli.md
    - Available tools: reference/vm-tools.md
    - Files and state: reference/files-and-state.md
  - Background:
    - Why sandbar: background/why.md
    - How provisioning works: background/how-it-works.md
    - Security model: background/security-model.md
  - Contributing:
    - Development: contributing/development.md
    - The embedded playbook: contributing/ansible-playbook.md
    - Base image build: contributing/base-image.md
    - Releases: contributing/releases.md
    - Writing guide: contributing/writing-guide.md
