# Documentation site. Two behaviours:
#
#   * pull_request — `mkdocs build --strict` so a broken link or nav
#     reference fails CI instead of reaching `main`.
#   * push to main / release tags — publish with `mike`, which commits and
#     pushes the built site straight to the `gh-pages` branch. This is NOT
#     the OIDC `actions/deploy-pages` flow: no `pages:` permission, no
#     `id-token:`, no `environment:` block, just `contents: write` and a git
#     identity for mike to commit as.
#
# Tags are `vX.Y.Z` (release-please's default `include-v-in-tag`, confirmed
# against `git tag --list` and `release-please-config.json`), so release
# pushes deploy that version and move the `latest` alias to it.
#
# Human prerequisite (one-time, NOT performed by this workflow): point
# GitHub Pages at the `gh-pages` branch — Settings > Pages > Deploy from a
# branch > gh-pages / root.
name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# The two behaviours above want OPPOSITE things from a concurrency group, so
# they no longer share one.
#
#   * deploy — `pages`, never cancelled. mike commits and pushes to `gh-pages`,
#     so two deploys racing would fight over the same branch, and cancelling one
#     half-way through leaves that push unfinished.
#   * build — one group per PR, superseding its own older runs. A PR build
#     touches nothing shared; the only run worth keeping is the newest.
#
# Sharing `pages` made every PR build queue behind the deploy lane, and with
# `cancel-in-progress: false` GitHub keeps just ONE pending run per group and
# cancels the rest — so opening a stack of seven PRs at once ran the strict docs
# build on two of them and silently cancelled five. A cancelled run registers no
# check, so those PRs looked green with the guard never having run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Strict docs build
        run: uvx --with-requirements docs/requirements.txt mkdocs build --strict

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy main docs
        if: github.ref == 'refs/heads/main'
        run: uvx --with-requirements docs/requirements.txt mike deploy --push main

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Deploy release docs
        if: startsWith(github.ref, 'refs/tags/v')
        run: uvx --with-requirements docs/requirements.txt mike deploy --push --update-aliases "${{ steps.version.outputs.version }}" latest

      - name: Set default version
        if: startsWith(github.ref, 'refs/tags/v')
        run: uvx --with-requirements docs/requirements.txt mike set-default --push latest
