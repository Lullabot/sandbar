# Reusable Debian 13 base image for Lima and Proxmox. Each image contains the
# base playbook's tools and qemu-guest-agent, with machine identity removed.
#
# Releases are IMMUTABLE in this repo: create a draft, upload every asset, then
# publish it. New tags use base-image-YYYY.MM.DD.HHMMSS in UTC so multiple
# immutable images can ship in one day; legacy date-only tags remain valid.
# The namespace stays disjoint from release-please's vX.Y.Z tags. Keep --repo
# explicit on gh commands.
name: Base image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (default: base-image-YYYY.MM.DD.HHMMSS UTC)'
        required: false
        default: ''
  schedule:
    - cron: '0 6 1 * *' # 06:00 UTC on the 1st of each month

permissions:
  contents: read

concurrency:
  group: base-image
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    # The native arm64 standard runner is available for public repositories.
    # Neither architecture needs /dev/kvm: the builder edits a mounted disk.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      ARCH: ${{ matrix.arch }}
      ASSET: sandbar-base-debian-13-${{ matrix.arch }}.qcow2
      IMAGE_DIR: /var/tmp/sand-base-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install qemu tools and show disk capacity
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils
          df -h /var/tmp

      - name: Build reusable base image
        run: |
          mkdir -p "$IMAGE_DIR"
          sudo ./scripts/build-base-image.sh --arch "$ARCH" --out "$IMAGE_DIR/$ASSET"

      - name: Enforce image hygiene and calculate checksum
        run: |
          sudo ./scripts/check-base-image.sh "$IMAGE_DIR/$ASSET"
          cd "$IMAGE_DIR"
          sha256sum "$ASSET" > "$ASSET.sha256"
          sha256sum -c "$ASSET.sha256"
          ls -lh "$ASSET" "$ASSET.sha256"

      # qcow2 is already compressed. Artifact compression would burn runner
      # time for almost no gain; the two jobs transfer through artifact storage.
      - name: Transfer image and checksum to publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: base-image-${{ matrix.arch }}
          path: |
            /var/tmp/sand-base-image/${{ env.ASSET }}
            /var/tmp/sand-base-image/${{ env.ASSET }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish both architectures
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_INPUT: ${{ inputs.tag }}
      IMAGE_DIR: /var/tmp/sand-base-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download amd64 image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-image-amd64
          path: /var/tmp/sand-base-image

      - name: Download arm64 image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: base-image-arm64
          path: /var/tmp/sand-base-image

      - name: Resolve tag and verify manifest inputs
        id: tag
        run: |
          tag="$TAG_INPUT"
          if [[ -z "$tag" ]]; then tag="base-image-$(date -u +%Y.%m.%d.%H%M%S)"; fi
          python3 scripts/write_base_image_manifest.py \
            --tag "$tag" --repo "$GITHUB_REPOSITORY" \
            --assets "$IMAGE_DIR" --output "$IMAGE_DIR/manifest.json"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          cat "$IMAGE_DIR/manifest.json"

      - name: Publish complete release (draft first for immutable releases)
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft \
            --title "Base image $TAG" \
            --notes "Reusable Debian 13 base images for sand's Lima and Proxmox providers. Verify each image with its .sha256 asset; manifest.json records both architecture digests."
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            "$IMAGE_DIR/sandbar-base-debian-13-amd64.qcow2" \
            "$IMAGE_DIR/sandbar-base-debian-13-amd64.qcow2.sha256" \
            "$IMAGE_DIR/sandbar-base-debian-13-arm64.qcow2" \
            "$IMAGE_DIR/sandbar-base-debian-13-arm64.qcow2.sha256" \
            "$IMAGE_DIR/manifest.json"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published $TAG with both image architectures and manifest.json"
