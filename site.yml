---
- name: Provision development VM for coding agents
  hosts: all
  become: true
  # provision_phase splits the run so a generic "base" VM can be built once and
  # cloned cheaply:
  #   full     - everything in one pass (default; the non-clone / curl|bash flow)
  #   base     - heavy, identity-free setup baked into the clone source
  #   finalize - light per-clone work (hostname, git identity, repo). No apt
  #              upgrade: that is paid once on the base by its 30-day
  #              self-refresh (base_apt_upgrade), not re-paid by every clone.
  # Tasks gate on this with `when:`; fact-gathering stays ungated so both phases
  # see it. Runtimes and browser review stay in the base; coding agents and the
  # project are per-clone.
  # Flags for /usr/local/libexec/sandbar-safe-home-file, defined once so every
  # home file the playbook writes is judged by the same rule. Play vars are
  # evaluated when used, so sand_new_user (set by roles/user) is seen.
  #   --preserved-home  the home came back from the VM being reset, so an
  #                     existing file is the user's until its baseline proves
  #                     otherwise.
  #   --fresh-clone     this guest's files are sandbar's own defaults: a base
  #                     build, a fresh clone, or a full run creating its user.
  # sand_agent_file_flags is for agent state (AgentStatePaths in
  # internal/provision/preserve.go), which a preserve-agents reset restores
  # without the rest of the home.
  vars:
    sand_file_fresh_flag: "{{ ['--fresh-clone'] if provision_phase | default('full') == 'base' or sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool else [] }}"
    sand_home_file_flags: "{{ (['--preserved-home'] if sand_preserved_home | default(false) | bool else []) + sand_file_fresh_flag }}"
    sand_agent_file_flags: "{{ (['--preserved-home'] if sand_preserved_home | default(false) | bool or sand_preserved_agents | default(false) | bool else []) + sand_file_fresh_flag }}"
    # Sandbar's own agent launchers and user units are code, not configuration
    # a user is expected to edit, so they live outside the home: a reset
    # preserves the home but always rebuilds the root filesystem, so every
    # clone gets the current copies with no baseline to consult. Each file
    # dropped in sand_bashrc_d is loaded by a block in sand_system_bashrc,
    # which bash reads before ~/.bashrc, so a user's own definition still wins.
    sand_bashrc_d: /usr/local/share/sandbar/bashrc.d
    sand_system_bashrc: /etc/bash.bashrc
    sand_systemd_user_dir: /etc/systemd/user
    # Skills sandbar ships to an agent, linked into its skills directory.
    sand_skills_dir: /usr/local/share/sandbar/skills
  roles:
    - base
    - user
    - role: agent-clipboard
      when: provision_phase | default('full') != 'finalize'
    - role: agent-cleanup
      when: provision_phase | default('full') == 'base'
    # Samba is for non-Lima / remote-host deployments. The Lima flow sets
    # samba_enabled=false (use a bind mount or `limactl copy` instead).
    - role: samba
      when:
        - samba_enabled | default(true) | bool
        - provision_phase | default('full') != 'finalize'
    - role: dev-tools
      when: provision_phase | default('full') != 'finalize'
    # mkcert is baked with the other packages, but its CA private key belongs
    # to each clone. This role follows dev-tools so full runs have the binary.
    - role: mkcert-ca
      when: provision_phase | default('full') != 'base'
    # Agent releases change frequently, so fetch them only after cloning.
    - role: claude-code
      when:
        - toolset_claude | default(false) | bool
        - provision_phase | default('full') != 'base'
    - role: codex
      when:
        - toolset_codex | default(false) | bool
        - provision_phase | default('full') != 'base'
    - role: opencode
      when:
        - toolset_opencode | default(false) | bool
        - provision_phase | default('full') != 'base'
    - role: pi
      when:
        - toolset_pi | default(false) | bool
        - provision_phase | default('full') != 'base'
    # Installs the agents selected above, all at once, after their roles have
    # written every configuration file (see roles/agent-install for why that
    # ordering matters).
    - role: agent-install
      when:
        - provision_phase | default('full') != 'base'
        - (toolset_claude | default(false) | bool) or (toolset_codex | default(false) | bool) or (toolset_opencode | default(false) | bool) or (toolset_pi | default(false) | bool)
    - role: agent-context
      when:
        - provision_phase | default('full') != 'base'
        - (toolset_claude | default(false) | bool) or (toolset_codex | default(false) | bool) or (toolset_opencode | default(false) | bool) or (toolset_pi | default(false) | bool)
    # The browser review UI is NOT a tool-set selection: it is a pinned 17MB
    # npm install with no build step that runs only when `sand land --review`
    # invokes it, so it is simply part of the image. Making it a selection
    # bought nothing and cost real correctness -- an unpassed --with-* flag
    # adopts the existing base's stamp, so a base built before this role
    # existed adopted "off" and skipped the role, which no amount of
    # rebuilding fixed. Unconditional, it installs on the next converge like
    # any other playbook change.
    - role: self-review
      when:
        - provision_phase | default('full') != 'finalize'
    - role: project
      when: provision_phase | default('full') != 'base'

  # These files receive deliberate sandbar block/line edits after the user role
  # installs its defaults. Capture the final bytes on fresh guests only, so a
  # later preserve-home reset can distinguish those defaults from user edits.
  post_tasks:
    - name: Record final sandbar home defaults
      ansible.builtin.command:
        argv: [python3, /usr/local/libexec/sandbar-safe-home-file, "{{ user_home }}", "{{ item.path }}", "{{ user_name }}", "0644", --record-current]
      register: sand_recorded_home_default
      changed_when: sand_recorded_home_default.stdout is search('^changed:')
      loop:
        - path: .bashrc
          safe: "{{ provision_phase | default('full') == 'base' or sand_bashrc_writable | default(false) | bool }}"
        - path: .profile
          safe: "{{ provision_phase | default('full') == 'base' or sand_profile_writable | default(false) | bool }}"
        - path: .gitconfig
          safe: "{{ (sand_gitconfig_install.stdout | default('')) is search('installed default') }}"
        - path: .claude/settings.json
          safe: "{{ (sand_claude_settings_install.stdout | default('')) is search('installed default') and not sand_preserved_home | default(false) | bool and not sand_preserved_agents | default(false) | bool }}"
      when: item.safe | bool
