---
- name: Converge
  hosts: all
  become: true
  vars:
    # roles/base/tasks/main.yml folds devtools_docker_packages,
    # devtools_packages, and devtools_ddev_packages (all owned by the
    # dev-tools role's defaults) into its single apt transaction. In
    # production this works because site.yml lists every role in one play,
    # so Ansible merges all of their role defaults play-wide before any task
    # runs. This scenario converges `base` alone, so those three lists are
    # supplied directly instead of pulling in the dev-tools role.
    devtools_docker_packages: []
    devtools_packages: []
    devtools_ddev_packages: []
    # Keep the scenario to the base role's own foundational work: skip the
    # optional toolchains (golang, JDK, ddev) this role can fold in. They
    # add ~700MB and external repos unrelated to what verify.yml checks.
    toolset_go: false
    toolset_java: false
    toolset_ddev: false
    # Deliberately NOT the Etc/UTC default: containers already run UTC, so
    # verifying the default would pass whether or not the role's timezone tasks
    # ran at all. A zone the container cannot already be in is what proves
    # base_timezone actually drives the outcome.
    base_timezone: America/Toronto
  roles:
    - role: base

# The timezone tasks are the only ones in roles/base that deliberately run in
# the FINALIZE phase, surrounded by a wall of neighbours carrying
# `when: provision_phase != 'finalize'`. That is what lets a clone taken from a
# base built before the feature existed still land in the right zone — and
# nothing else in the suite covers it, so a later edit adding the neighbours'
# `when:` to these three tasks would silently put every such clone back in UTC.
#
# This second play is the guard. It re-runs the role in the finalize phase with
# a DIFFERENT zone, so the final state verify.yml asserts (Europe/Berlin) is
# reachable ONLY if the timezone tasks ran during finalize: the base play above
# left the guest on America/Toronto, and finalize skips every other task here.
- name: Converge again in the finalize phase
  hosts: all
  become: true
  vars:
    devtools_docker_packages: []
    devtools_packages: []
    devtools_ddev_packages: []
    toolset_go: false
    toolset_java: false
    toolset_ddev: false
    provision_phase: finalize
    base_timezone: Europe/Berlin
  roles:
    - role: base
