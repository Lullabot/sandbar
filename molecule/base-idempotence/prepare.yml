---
- name: Prepare
  hosts: all
  become: true
  tasks:
    # Docker bind-mounts both files, preventing the role's atomic writes.
    - name: Check whether Docker mounted hostname and hosts files
      ansible.builtin.command: mountpoint -q {{ item }}
      loop:
        - /etc/hostname
        - /etc/hosts
      register: _docker_injected_mounts
      changed_when: false
      failed_when: false

    - name: Remove Docker's injected hostname and hosts file mounts
      ansible.builtin.command: umount {{ item.item }}
      loop: "{{ _docker_injected_mounts.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.rc == 0

    # The real image bootstrap provides these before the base role's early
    # locale generation and repository-key setup.
    - name: Ensure bootstrap packages are present before the base role runs
      ansible.builtin.apt:
        name:
          - locales
          - gnupg
        state: present
        update_cache: true
