---
# This scenario checks a stable base-phase replay with the default
# sand_image_build=false path. The base scenario separately checks the
# base -> finalize timezone transition, which necessarily changes files each
# time Molecule reruns its two-play converge for idempotence.
driver:
  name: docker
platforms:
  - name: base-idempotence-instance
    image: "geerlingguy/docker-debian13-ansible:latest@sha256:32aea259e42294f7fffbb29ce401692f56ae75917f15793bbe486e403ce41152"
    command: /sbin/init
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  playbook:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
