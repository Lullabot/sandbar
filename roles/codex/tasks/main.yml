---
- name: Get home directory for {{ user_name }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_name }}"

- name: Set user home directory fact
  ansible.builtin.set_fact:
    user_home: "{{ ansible_facts.getent_passwd[user_name][4] }}"

- name: Create ~/.codex directory
  ansible.builtin.file:
    path: "{{ user_home }}/.codex"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  when: (sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool) and not sand_preserved_home | default(false) | bool and not sand_preserved_agents | default(false) | bool

- name: Deploy ~/.codex/config.toml from template
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.codex/config.toml', user_name, '0644'] + (['--preserved-home'] if (sand_preserved_home | default(false) | bool) or (sand_preserved_agents | default(false) | bool) else []) + (['--fresh-clone'] if sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool else []) }}"
    stdin: "{{ lookup('ansible.builtin.template', 'codex-config.toml.j2') }}"
    stdin_add_newline: false
  register: sand_codex_config_install
  changed_when: sand_codex_config_install.stdout is search('^changed:')

- name: Install OpenAI Codex using the official installer
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://chatgpt.com/codex/install.sh | sh
    executable: /bin/bash
  become: true
  become_user: "{{ user_name }}"
  environment:
    HOME: "{{ user_home }}"
    CODEX_NON_INTERACTIVE: "true"

- name: Add ~/.local/bin to PATH in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    regexp: '(^|^export )PATH=.*\.local/bin'
    create: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"
  when: sand_bashrc_writable | default(false) | bool

- name: Ensure ~/.config/sandbar directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/sandbar"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0700"
  when: (sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool) and not sand_preserved_home | default(false) | bool

- name: Install Codex first-run remote-control wrapper
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.config/sandbar/codex-shell-wrapper.sh', user_name, '0644'] + (['--preserved-home'] if sand_preserved_home | default(false) | bool else []) + (['--fresh-clone'] if sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool else []) }}"
    stdin: "{{ lookup('ansible.builtin.file', 'codex-shell-wrapper.sh') }}"
    stdin_add_newline: false
  register: sand_codex_wrapper_install
  changed_when: sand_codex_wrapper_install.stdout is search('^changed:')

- name: Ensure user systemd directory exists for Codex
  ansible.builtin.file:
    path: "{{ user_home }}/.config/systemd/user"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  when: (sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool) and not sand_preserved_home | default(false) | bool

- name: Install disabled Codex boot service
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.config/systemd/user/sandbar-codex-app-server.service', user_name, '0644'] + (['--preserved-home'] if sand_preserved_home | default(false) | bool else []) + (['--fresh-clone'] if sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool else []) }}"
    stdin: "{{ lookup('ansible.builtin.file', 'sandbar-codex-app-server.service') }}"
    stdin_add_newline: false
  register: sand_codex_service_install
  changed_when: sand_codex_service_install.stdout is search('^changed:')

# VMs that completed onboarding before the boot service was introduced already
# have the marker, so their wrapper will not run the opt-in path again.
- name: Check for prior Codex remote-control onboarding
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/sandbar/codex-remote-control-onboarding-complete"
  register: codex_onboarding_marker

- name: Check Codex daemon settings
  ansible.builtin.stat:
    path: "{{ user_home }}/.codex/app-server-daemon/settings.json"
  register: codex_daemon_settings

- name: Read existing Codex daemon settings
  ansible.builtin.slurp:
    src: "{{ user_home }}/.codex/app-server-daemon/settings.json"
  register: codex_daemon_settings_content
  when:
    - codex_onboarding_marker.stat.exists
    - codex_daemon_settings.stat.exists

- name: Enable and start Codex boot service for existing opt-ins
  ansible.builtin.systemd_service:
    name: sandbar-codex-app-server.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_user: "{{ user_name }}"
  environment:
    HOME: "{{ user_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[user_name][1] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts.getent_passwd[user_name][1] }}/bus"
  when:
    - codex_onboarding_marker.stat.exists
    - codex_daemon_settings.stat.exists
    - (codex_daemon_settings_content.content | b64decode | from_json).remoteControlEnabled | default(false) | bool

- name: Load Codex first-run remote-control wrapper from ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.bashrc"
    line: '. "$HOME/.config/sandbar/codex-shell-wrapper.sh"'
    regexp: '^\. "\$HOME/\.config/sandbar/codex-shell-wrapper\.sh"$'
    create: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"
  when: sand_bashrc_writable | default(false) | bool
