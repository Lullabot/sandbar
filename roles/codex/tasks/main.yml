---
- name: Get home directory for {{ user_name }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_name }}"

- name: Set user home directory fact
  ansible.builtin.set_fact:
    user_home: "{{ ansible_facts.getent_passwd[user_name][4] }}"

- name: Create ~/.codex directory
  ansible.builtin.file:
    path: "{{ user_home }}/.codex"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  when: (sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool) and not sand_preserved_home | default(false) | bool and not sand_preserved_agents | default(false) | bool

- name: Deploy ~/.codex/config.toml from template
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.codex/config.toml', user_name, '0644'] + sand_agent_file_flags }}"
    stdin: "{{ lookup('ansible.builtin.template', 'codex-config.toml.j2') }}"
    stdin_add_newline: false
  register: sand_codex_config_install
  changed_when: sand_codex_config_install.stdout is search('^changed:')

# The Codex binary itself is installed by roles/agent-install, which runs
# after every agent role so the installers can run concurrently without racing
# this role's edits to ~/.bashrc and the agent's own configuration.
- name: Add ~/.local/bin to PATH in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    regexp: '(^|^export )PATH=.*\.local/bin'
    create: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"
  when: sand_bashrc_writable | default(false) | bool

- name: Ensure ~/.config/sandbar directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/sandbar"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0700"
  when: (sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool) and not sand_preserved_home | default(false) | bool

# The launcher and boot unit are code, not configuration, so they live outside
# the home where every clone rewrites them; roles/user loads sand_bashrc_d from
# /etc/bash.bashrc. Whether the unit is enabled is the user's choice and stays
# in the home: `systemctl --user enable` links it from ~/.config/systemd/user.
- name: Install the Codex interactive launcher
  ansible.builtin.copy:
    src: codex-shell-wrapper.sh
    dest: "{{ sand_bashrc_d }}/codex.sh"
    owner: root
    group: root
    mode: "0644"

- name: Ensure the system-wide user unit directory exists
  ansible.builtin.file:
    path: "{{ sand_systemd_user_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install disabled Codex boot service
  ansible.builtin.copy:
    src: sandbar-codex-app-server.service
    dest: "{{ sand_systemd_user_dir }}/sandbar-codex-app-server.service"
    owner: root
    group: root
    mode: "0644"
