base_hostname: claude
base_domain: lan
base_locale: en_CA.UTF-8
# UTC is the fallback, not the intent: `sand create` overrides this with the
# timezone of the host it is running on (vm.HostTimezone), which is the whole
# point of the setting. This default is what a bare `ansible-playbook site.yml`
# run gets, and it deliberately matches what a Debian/Ubuntu cloud image already
# ships — so a direct playbook run behaves exactly as it did before the timezone
# tasks existed. Override with -e base_timezone=America/Toronto.
base_timezone: Etc/UTC
# Whether a base_timezone the guest does not have should FAIL the run (true) or
# just warn and leave the guest's existing zone (false). Defaults to true
# because a value set by hand — `-e base_timezone=...`, or `sand create
# --timezone` — was deliberately chosen, and silently ignoring it would hand
# back a VM that is not in the zone that was asked for. sand sets this to false
# for a timezone it merely DETECTED off the host, so an undetectable or
# unusual host zone can never turn a working create into a failed one.
base_timezone_required: true
base_nodejs_major_version: 24
# Installed alongside base_packages in the single consolidated apt transaction
# (roles/base/tasks/main.yml, "Install every base-phase package").
base_nodejs_packages:
  - nodejs
# The base-phase apt transaction runs with install_recommends: false (see
# roles/base/tasks/main.yml), so this list is the whole answer: a package that is
# not named here, and is not a hard dependency of one that is, does not reach the
# image. Adding something back is exactly this — name it here.
#
# build-essential and python3-dev are the ones that bite. gcc/g++/make/libc6-dev
# used to arrive only as RECOMMENDS of golang and the JDK, so switching
# recommends off silently removed the C toolchain — breaking node-gyp (any npm or
# npx package with a native module), cgo (`go build` defaults to CGO_ENABLED=1),
# and pip packages with C extensions. They are named here so the toolchain is a
# stated requirement of the image rather than a side effect of two optional tools
# that a user can de-select.
base_packages:
  - acl
  - bash-completion
  - bats
  - build-essential
  - ca-certificates
  - curl
  - direnv
  - git
  - gnupg
  - htop
  - jq
  - locales
  - lsof
  - mkcert
  - ncdu
  - ncurses-term
  - openssh-server
  - python3
  - python3-dev
  - python3-pip
  - qemu-guest-agent
  - rsync
  - screen
  - sudo
  - tmux
  - traceroute
  # The timezone tasks in roles/base/tasks/main.yml symlink /etc/localtime into
  # /usr/share/zoneinfo, which is this package. It is already present on every
  # Debian/Ubuntu cloud image, so naming it costs nothing — but it arrives there
  # as a dependency of something else, and with install_recommends off (see the
  # comment at the top of this list) that is exactly the kind of thing that
  # disappears quietly. A missing tzdata fails the "Confirm the requested
  # timezone exists" assert with no hint that a PACKAGE is what's absent.
  - tzdata
  - unzip
  - vim
  - wget
  - xclip
  - xvfb
  - yq
  # A reset copies everything the user asked to keep out of the guest as a tar
  # stream, and the compressor runs HERE, in the guest, on the critical path. A
  # whole preserved home is routinely several gigabytes, where gzip is minutes
  # and zstd is seconds for the same archive size. A guest without it still
  # resets — internal/provision/compress.go falls back to gzip — just slowly.
  - zstd

# Direct-playbook defaults. Agent roles run per VM in full/finalize; dependency
# selections control the reusable base. Keep defaults together because role
# defaults are play-wide, including defaults of roles skipped by a gate.
toolset_claude: false
toolset_codex: false
toolset_opencode: false
toolset_pi: false
toolset_ddev: true
toolset_go: true
toolset_java: true

# golang and default-jdk-headless are ~500-700MB installed between them, so
# they are opt-out rather than unconditional entries in base_packages above.
# Folded into the single install transaction in roles/base/tasks/main.yml.
toolset_packages: >-
  {{ (['golang'] if toolset_go | bool else [])
   + (['default-jdk-headless'] if toolset_java | bool else []) }}
