---
# The bulk of this role is heavy, identity-free account setup that belongs in
# the base image (skipped in the finalize phase). The exceptions are the
# home-directory lookup, which both phases need, and ~/.gitconfig, which carries
# the per-clone git identity and so runs in finalize (and the single-pass full).
- name: Check whether a full run is creating a new account
  ansible.builtin.command:
    argv: [id, -u, "{{ user_name }}"]
  register: sand_existing_user_probe
  changed_when: false
  failed_when: sand_existing_user_probe.rc not in [0, 1]
  when: provision_phase | default('full') == 'full'

- name: Remember a newly created full-run account
  ansible.builtin.set_fact:
    sand_new_user: "{{ sand_existing_user_probe.rc == 1 }}"
  when: provision_phase | default('full') == 'full'

- name: Generate a secure random password
  ansible.builtin.set_fact:
    user_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', 'punctuation'], length=24) }}"
  when:
    - provision_phase | default('full') != 'finalize'
    - not sand_image_build

- name: Create user {{ user_name }}
  ansible.builtin.user:
    name: "{{ user_name }}"
    shell: "{{ user_shell }}"
    create_home: true
    groups: sudo
    append: true
    # An image carries no usable password across clones; the live path keeps
    # the generated password exactly as before.
    password: "{{ '!' if sand_image_build else (user_password | password_hash('sha512')) }}"
  when: provision_phase | default('full') != 'finalize'

# An overlapping shell usually keeps the user manager alive; the shutdown is
# seen only after every connection drains, and logged as a clean shutdown.
# The published image has no login yet, so finalize enables linger for the
# account cloud-init created on first boot. Existing bases already have it.
- name: Enable systemd linger for {{ user_name }} so detached tmux survives logout
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ user_name }}
  args:
    creates: /var/lib/systemd/linger/{{ user_name }}
  when: not sand_image_build

- name: Get home directory for {{ user_name }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_name }}"

- name: Set user home directory fact
  ansible.builtin.set_fact:
    user_home: "{{ ansible_facts.getent_passwd[user_name][4] }}"

# Keep the installer outside the restored home. A preserved home may contain a
# file with the same name as any of sand's config or metadata paths.
- name: Ensure sand system helper directory exists
  ansible.builtin.file:
    path: /usr/local/libexec
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install safe home default writer
  ansible.builtin.copy:
    src: safe_home_file.py
    dest: /usr/local/libexec/sandbar-safe-home-file
    owner: root
    group: root
    mode: "0755"

- name: Check whether preserved shell configuration is unchanged
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, item, user_name, '0644', '--check-managed'] + (['--preserved-home'] if sand_preserved_home | default(false) | bool else []) + (['--fresh-clone'] if sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool else []) }}"
  loop: [.bashrc, .profile]
  register: sand_shell_ownership
  changed_when: false
  failed_when: sand_shell_ownership.rc not in [0, 3]
  when: provision_phase | default('full') != 'base'

- name: Set preserved shell write permissions
  ansible.builtin.set_fact:
    sand_bashrc_writable: "{{ sand_shell_ownership.results[0].rc == 0 }}"
    sand_profile_writable: "{{ sand_shell_ownership.results[1].rc == 0 }}"
  when: provision_phase | default('full') != 'base'

# The base playbook added its temporary user to docker, but the distributed
# image removes that user. Apply this small per-login membership on finalize.
- name: Add cloud-init login to docker group
  ansible.builtin.user:
    name: "{{ user_name }}"
    shell: "{{ user_shell }}"
    groups: docker
    append: true
  when: provision_phase | default('full') == 'finalize'

- name: Deploy sudoers file for passwordless sudo
  ansible.builtin.copy:
    content: "%sudo ALL=(ALL:ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/nopasswd-sudo
    mode: "0440"
    validate: "visudo -cf %s"
  when: provision_phase | default('full') != 'finalize'

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.ssh"
    state: directory
    mode: "0700"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  when: provision_phase | default('full') != 'finalize'

# Optional: only for non-Lima / remote-host deployments that SSH in as the
# user. Lima injects its own key for `limactl shell`, so user_github_keys_url
# is left empty by default and this task is skipped.
- name: Fetch SSH authorized_keys from a URL
  ansible.builtin.get_url:
    url: "{{ user_github_keys_url }}"
    dest: "/tmp/{{ user_name }}-github-keys"
    mode: "0600"
  when:
    - user_github_keys_url | length > 0
    - provision_phase | default('full') != 'finalize'

# Read the fetched file into a variable rather than reaching for it from the
# loop. Ansible templates a task's `loop` BEFORE it evaluates the task's `when`,
# so a file lookup in the loop expression runs even in the finalize phase — where
# the fetch above is skipped and the file does not exist — and the whole play
# dies with "could not locate file in lookup". Keying the loop off `is defined`
# short-circuits instead: when the slurp is skipped, there is nothing to iterate.
- name: Read the fetched authorized_keys
  ansible.builtin.slurp:
    src: "/tmp/{{ user_name }}-github-keys"
  register: _github_keys
  when:
    - user_github_keys_url | length > 0
    - provision_phase | default('full') != 'finalize'

# File mode and ownership are load-bearing: sshd ignores authorized_keys that
# is group/world-writable or not owned by the user.
- name: Install fetched authorized_keys
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.ssh/authorized_keys"
    line: "{{ item }}"
    create: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0600"
  loop: "{{ (_github_keys.content | b64decode).splitlines() if (_github_keys.content is defined) else [] }}"
  when: _github_keys.content is defined

- name: Remove temporary GitHub keys file
  ansible.builtin.file:
    path: "/tmp/{{ user_name }}-github-keys"
    state: absent
  when:
    - user_github_keys_url | length > 0
    - provision_phase | default('full') != 'finalize'

- name: Deploy ~/.ssh/rc
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.ssh/rc', user_name, '0755'] + (['--preserved-home'] if sand_preserved_home | default(false) | bool else []) + (['--fresh-clone'] if provision_phase | default('full') == 'base' or sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool else []) }}"
    stdin: "{{ lookup('ansible.builtin.template', 'ssh_rc.j2') }}"
    stdin_add_newline: false
  register: sand_ssh_rc_install
  changed_when: sand_ssh_rc_install.stdout is search('^changed:')

# Deliberately UNGATED, unlike its identity-free neighbours above. Rendering a
# small template is cheap enough to re-pay per clone, and paying it in finalize
# too is what lets a change to tmux.conf.j2 reach a new VM WITHOUT rebuilding
# the base image it was cloned from — a base can be up to 30 days old before its
# self-refresh fires, and a stale ~/.tmux.conf is silently wrong rather than
# broken (the template's clipboard block is what got noticed missing that way).
# The writer compares against the bytes previously installed by sand. A reset
# restoring an edited or legacy home keeps that file and offers the new default.
- name: Deploy ~/.tmux.conf
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.tmux.conf', user_name, '0644'] + (['--preserved-home'] if sand_preserved_home | default(false) | bool else []) + (['--fresh-clone'] if provision_phase | default('full') == 'base' or sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool else []) }}"
    stdin: "{{ lookup('ansible.builtin.template', 'tmux.conf.j2') }}"
    stdin_add_newline: false
  register: sand_tmux_install
  changed_when: sand_tmux_install.stdout is search('^changed:')

- name: Deploy ~/.gitconfig
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.gitconfig', user_name, '0644', '--preserve-git-credentials-block'] + (['--preserved-home'] if sand_preserved_home | default(false) | bool else []) + (['--fresh-clone'] if sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool else []) }}"
    stdin: "{{ lookup('ansible.builtin.template', 'gitconfig.j2') }}"
    stdin_add_newline: false
  register: sand_gitconfig_install
  changed_when: sand_gitconfig_install.stdout is search('^changed:')
  when: provision_phase | default('full') != 'base'

- name: Ensure ~/.local/bin directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.local/bin"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  when: provision_phase | default('full') != 'finalize'

- name: Ensure ~/.config/direnv directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/direnv"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  when: provision_phase | default('full') != 'finalize'

- name: Deploy ~/.config/direnv/direnv.toml
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.config/direnv/direnv.toml', user_name, '0644'] + (['--preserved-home'] if sand_preserved_home | default(false) | bool else []) + (['--fresh-clone'] if provision_phase | default('full') == 'base' or sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool else []) }}"
    stdin: "[global]\nload_dotenv = true\n"
    stdin_add_newline: false
  register: sand_direnv_install
  changed_when: sand_direnv_install.stdout is search('^changed:')

- name: Ensure ~/.config/sandbar directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/sandbar"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0700"
  when: provision_phase | default('full') != 'finalize'

- name: Deploy bashrc customizations
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK"
    block: |
      export PATH="$HOME/.local/bin:$PATH"
      export IS_SANDBOX=1
      export VISUAL=vim
      export EDITOR=vim
      eval "$(direnv hook bash)"
      # Secrets are written by `sand` on VM start; the file is absent until then.
      if [ -f "$HOME/.config/sandbar/secrets.env" ]; then
        . "$HOME/.config/sandbar/secrets.env"
      fi
  when: provision_phase | default('full') == 'base' or sand_bashrc_writable | default(false) | bool

- name: Source the sandbar secrets file from ~/.profile (login shells)
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.profile"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - sandbar secrets"
    create: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"
    block: |
      # Secrets are written by `sand` on VM start; the file is absent until then.
      if [ -f "$HOME/.config/sandbar/secrets.env" ]; then
        . "$HOME/.config/sandbar/secrets.env"
      fi
  when: provision_phase | default('full') == 'base' or sand_profile_writable | default(false) | bool

- name: Offer shell defaults for edited or unknown preserved files
  ansible.builtin.command:
    argv: [python3, /usr/local/libexec/sandbar-safe-home-file, "{{ user_home }}", "{{ item.path }}", "{{ user_name }}", "0644", --propose-only]
    stdin: "{{ lookup('ansible.builtin.template', item.template) }}"
    stdin_add_newline: false
  register: sand_shell_proposal
  changed_when: sand_shell_proposal.stdout is search('^changed:')
  loop:
    - {path: .bashrc, template: bashrc-additions.j2, writable: "{{ sand_bashrc_writable | default(false) | bool }}"}
    - {path: .profile, template: profile-additions.j2, writable: "{{ sand_profile_writable | default(false) | bool }}"}
  when:
    - provision_phase | default('full') != 'base'
    - not item.writable | bool

- name: Display generated password for {{ user_name }}
  ansible.builtin.debug:
    msg: >-
      Password for user '{{ user_name }}': {{ user_password }}
      (use for SSH and Samba access)
  when:
    - provision_phase | default('full') != 'finalize'
    - not sand_image_build
