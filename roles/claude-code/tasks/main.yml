---
- name: Get home directory for {{ user_name }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_name }}"

- name: Set user home directory fact
  ansible.builtin.set_fact:
    user_home: "{{ ansible_facts.getent_passwd[user_name][4] }}"

- name: Create ~/.claude directory
  ansible.builtin.file:
    path: "{{ user_home }}/.claude"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"

# The SessionStart/CwdChanged hooks in the template load direnv's exports
# (scoped .env secrets, see roles/project and docs/using-sand/secrets.md)
# into every Claude Code session. Without them only interactive shells get
# the scoped secrets: direnv's bash hook rides on PROMPT_COMMAND, which
# never fires in Claude Code's non-interactive Bash tool — and sessions
# dispatched from `claude agents` additionally inherit the environment of
# wherever the supervisor was started, not the repo they work in. The hook's
# `2>/dev/null || true` keeps a working directory whose .env was never
# `direnv allow`ed (direnv exits non-zero there) from surfacing as a failing
# hook on every cwd change; that directory just loads no scoped secret.
- name: Deploy ~/.claude/settings.json from template
  ansible.builtin.template:
    src: claude-settings.json.j2
    dest: "{{ user_home }}/.claude/settings.json"
    force: false
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"

# Older sand releases provisioned remoteControlAtStartup=true and predate Claude
# Code's cross-machine session messaging. The template is create-only, so merge
# the safe defaults into an existing settings file without destroying user
# customizations. Cross-machine sends always require approval; Remote Control is
# forced off only until the user has answered its separate opt-in prompt.
# The workstation notification channel is explicit because SSH and guest tmux
# hide terminal identity. Unknown terminals leave the existing choice intact.
- name: Check for prior Claude remote-control onboarding
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/sandbar/claude-remote-control-onboarding-complete"
  register: claude_onboarding_marker

- name: Read Claude settings for safe communication defaults
  ansible.builtin.slurp:
    src: "{{ user_home }}/.claude/settings.json"
  register: claude_settings_content

- name: Isolate peer machines and keep Remote Control opt-in
  ansible.builtin.copy:
    content: "{{ (claude_settings_content.content | b64decode | from_json | combine({'isolatePeerMachines': true}) | combine((not claude_onboarding_marker.stat.exists) | ternary({'remoteControlAtStartup': false}, {})) | combine((claude_notification_channel | default('') in ['iterm2', 'kitty', 'ghostty']) | ternary({'preferredNotifChannel': claude_notification_channel | default('')}, {}))) | to_nice_json }}\n"
    dest: "{{ user_home }}/.claude/settings.json"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"

# Claude Code only honors --dangerously-skip-permissions after its first-run
# onboarding has completed: with a fresh ~/.claude.json the very first
# interactive session runs the theme/login wizard and comes up WITHOUT bypass
# permissions until the user quits and relaunches
# (anthropics/claude-code#25503, #52501). Seeding hasCompletedOnboarding makes
# the first launch start in bypass mode immediately; the user still runs
# /login in-session. create-only (force: false) so a re-provision never
# clobbers a real config holding the OAuth account.
- name: Seed ~/.claude.json so the first launch honors bypass permissions
  ansible.builtin.copy:
    content: |
      {"hasCompletedOnboarding": true}
    dest: "{{ user_home }}/.claude.json"
    force: false
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0600"

- name: Install Claude Code using the official installer
  ansible.builtin.shell:
    cmd: set -o pipefail && curl -fsSL https://claude.ai/install.sh | bash -s -- latest
    executable: /bin/bash
  become: true
  become_user: "{{ user_name }}"
  environment:
    HOME: "{{ user_home }}"

- name: Add ~/.local/bin to PATH in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    regexp: '(^|^export )PATH=.*\.local/bin'
    create: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"

- name: Ensure ~/.config/sandbar directory exists for Claude
  ansible.builtin.file:
    path: "{{ user_home }}/.config/sandbar"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0700"

- name: Install Claude first-run remote-control wrapper
  ansible.builtin.copy:
    src: claude-shell-wrapper.sh
    dest: "{{ user_home }}/.config/sandbar/claude-shell-wrapper.sh"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"

- name: Configure the Claude Code interactive launcher
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Claude Code"
    create: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"
    block: |
      . "$HOME/.config/sandbar/claude-shell-wrapper.sh"
