---
- name: Get home directory for {{ user_name }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_name }}"

- name: Set user home directory fact
  ansible.builtin.set_fact:
    user_home: "{{ ansible_facts.getent_passwd[user_name][4] }}"

- name: Create ~/.claude directory
  ansible.builtin.file:
    path: "{{ user_home }}/.claude"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0755"
  when: (sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool) and not sand_preserved_home | default(false) | bool and not sand_preserved_agents | default(false) | bool

# The SessionStart/CwdChanged hooks in the template load direnv's exports
# (scoped .env secrets, see roles/project and docs/using-sand/secrets.md)
# into every Claude Code session. Without them only interactive shells get
# the scoped secrets: direnv's bash hook rides on PROMPT_COMMAND, which
# never fires in Claude Code's non-interactive Bash tool — and sessions
# dispatched from `claude agents` additionally inherit the environment of
# wherever the supervisor was started, not the repo they work in. The hook's
# `2>/dev/null || true` keeps a working directory whose .env was never
# `direnv allow`ed (direnv exits non-zero there) from surfacing as a failing
# hook on every cwd change; that directory just loads no scoped secret.
- name: Deploy ~/.claude/settings.json from template
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.claude/settings.json', user_name, '0644'] + sand_agent_file_flags }}"
    stdin: "{{ lookup('ansible.builtin.template', 'claude-settings.json.j2') }}"
    stdin_add_newline: false
  register: sand_claude_settings_install
  changed_when: sand_claude_settings_install.stdout is search('^changed:')

# Older sand releases provisioned remoteControlAtStartup=true and predate Claude
# Code's cross-machine session messaging. Only settings the safe installer
# accepted as sand-owned reach this merge; edited or unknown settings remain
# untouched with the new template offered separately. Cross-machine sends
# require approval; Remote Control remains opt-in until onboarding is answered.
# The workstation notification channel is explicit because SSH and guest tmux
# hide terminal identity. Unknown terminals leave the existing choice intact.
# The permission mode follows the same rule as Remote Control: auto mode until
# the user answers the launcher's one-time bypass question, then whatever they
# chose (or later set through /config). Older releases started every session in
# bypass through a flag alone, so this also moves those VMs to auto mode and
# lets the launcher ask them once — when their settings reach this merge. A
# settings file the installer kept as edited or of unknown history keeps its
# mode, and the auto default is offered in the separate proposal instead.
- name: Check for prior Claude remote-control onboarding
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/sandbar/claude-remote-control-onboarding-complete"
  register: claude_onboarding_marker

- name: Check for prior Claude permission-mode onboarding
  ansible.builtin.stat:
    path: "{{ user_home }}/.config/sandbar/claude-permission-mode-onboarding-complete"
  register: claude_permission_mode_marker

- name: Read Claude settings for safe communication defaults
  ansible.builtin.slurp:
    src: "{{ user_home }}/.claude/settings.json"
  register: claude_settings_content
  when: not (sand_preserved_home | default(false) | bool) and not (sand_preserved_agents | default(false) | bool) and sand_claude_settings_install.stdout is search('installed default')

- name: Isolate peer machines and keep Remote Control opt-in
  ansible.builtin.copy:
    content: "{{ (claude_settings_content.content | b64decode | from_json | combine({'isolatePeerMachines': true}) | combine((not claude_onboarding_marker.stat.exists) | ternary({'remoteControlAtStartup': false}, {})) | combine((not claude_permission_mode_marker.stat.exists) | ternary({'permissions': {'defaultMode': 'auto'}}, {}), recursive=True) | combine((claude_notification_channel | default('') in ['iterm2', 'kitty', 'ghostty']) | ternary({'preferredNotifChannel': claude_notification_channel | default('')}, {}))) | to_nice_json }}\n"
    dest: "{{ user_home }}/.claude/settings.json"
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  when: not (sand_preserved_home | default(false) | bool) and not (sand_preserved_agents | default(false) | bool) and sand_claude_settings_install.stdout is search('installed default')

# Claude Code only honors its configured permission mode (auto, or bypass via
# --dangerously-skip-permissions) after its first-run onboarding has completed:
# with a fresh ~/.claude.json the very first interactive session runs the
# theme/login wizard and comes up in manual mode until the user quits and
# relaunches (anthropics/claude-code#25503, #52501). Seeding
# hasCompletedOnboarding makes the first launch start in the chosen mode
# immediately; the user still runs /login in-session. The safe installer keeps
# a real config holding the OAuth account when it differs from its recorded
# baseline or has unknown history.
- name: Seed ~/.claude.json so the first launch honors bypass permissions
  ansible.builtin.command:
    argv: "{{ ['python3', '/usr/local/libexec/sandbar-safe-home-file', user_home, '.claude.json', user_name, '0600'] + sand_agent_file_flags }}"
    stdin: "{\"hasCompletedOnboarding\": true}\n"
    stdin_add_newline: false
  register: sand_claude_seed_install
  changed_when: sand_claude_seed_install.stdout is search('^changed:')

# The Claude Code binary itself is installed by roles/agent-install, which runs
# after every agent role so the installers can run concurrently without racing
# this role's edits to ~/.bashrc and the agent's own configuration.
- name: Add ~/.local/bin to PATH in ~/.bashrc
  ansible.builtin.lineinfile:
    path: "{{ user_home }}/.bashrc"
    line: 'export PATH="$HOME/.local/bin:$PATH"'
    regexp: '(^|^export )PATH=.*\.local/bin'
    create: true
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0644"
  when: sand_bashrc_writable | default(false) | bool

- name: Ensure ~/.config/sandbar directory exists for Claude
  ansible.builtin.file:
    path: "{{ user_home }}/.config/sandbar"
    state: directory
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
    mode: "0700"
  when: (sand_fresh_clone | default(false) | bool or sand_new_user | default(false) | bool) and not sand_preserved_home | default(false) | bool

# The launcher is code, not configuration, so it lives outside the home where
# every clone rewrites it; roles/user loads sand_bashrc_d from /etc/bash.bashrc.
# Its state (the onboarding markers and settings.json) stays in the home.
- name: Install the Claude Code interactive launcher
  ansible.builtin.copy:
    src: claude-shell-wrapper.sh
    dest: "{{ sand_bashrc_d }}/claude.sh"
    owner: root
    group: root
    mode: "0644"
