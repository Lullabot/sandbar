---
- name: Create the self-review install directory
  ansible.builtin.file:
    path: "{{ selfreview_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The manifest is a TEMPLATE rather than a copied file so the pinned version
# lives in one place (defaults/main.yml) and so its `changed` result is what
# gates the install below — a version bump rewrites this file, and that is the
# signal to re-run npm. Nothing else re-runs it, which is what keeps a
# converge at changed=0.
#
# The `overrides` entry in that template is the load-bearing part, and it is
# worth understanding before touching it. @self-review/serve declares
# @self-review/react as a RUNTIME dependency, but it is not one: the browser
# client ships prebuilt in the package's own dist/client, and the only thing
# that ever needed React was the vite build that produced it upstream. Nothing
# in dist/cli.js's import graph reaches it — the server's only non-builtin
# import is @self-review/core.
#
# Installing it anyway is not a rounding error. Measured against 1.45.0:
# 320 packages and 310MB with it, 17 packages and 17MB without — the
# difference being mermaid (84MB), lucide-react (45MB), @emoji-mart (27MB),
# @base-ui (21MB) and es-toolkit (18MB), every one of them reached ONLY
# through that one dependency. Deleting the directory afterwards would not
# help, because npm hoists those transitive packages to the top level where
# they are no longer identifiable as react's.
#
# So the dependency is replaced, by npm itself, with @self-review/types — a
# real package, already in the tree, small — and its subtree is therefore
# never fetched at all. The verification task at the bottom of this file is
# what keeps the substitution honest.
#
# The upstream fix is to move @self-review/react to devDependencies in
# packages/serve/package.json. If that lands, this override simply stops
# having anything to substitute.
- name: Write the pinned self-review install manifest
  ansible.builtin.template:
    src: package.json.j2
    dest: "{{ selfreview_install_dir }}/package.json"
    owner: root
    group: root
    mode: "0644"
  register: selfreview_manifest

- name: Check whether the review tool is already installed
  ansible.builtin.stat:
    path: "{{ selfreview_install_dir }}/node_modules/.bin/self-review-serve"
  register: selfreview_bin

- name: Install the pinned @self-review/serve release
  ansible.builtin.command:
    cmd: npm install --no-audit --no-fund --omit=dev
    chdir: "{{ selfreview_install_dir }}"
  when: selfreview_manifest.changed or not selfreview_bin.stat.exists
  changed_when: true

# A link rather than an install into a global npm prefix: the install above is
# self-contained in one directory, so the only thing that has to be global is
# the entry point. internal/landreview invokes it by bare name, so all this
# has to guarantee is that the name resolves on a default PATH.
- name: Link the review tool onto PATH
  ansible.builtin.file:
    src: "{{ selfreview_install_dir }}/node_modules/.bin/self-review-serve"
    dest: "{{ selfreview_bin_dir }}/self-review-serve"
    state: link
    owner: root
    group: root

# The install above substitutes one of upstream's declared dependencies, so
# this play does not get to ASSUME the result runs — it has to demonstrate it.
# `--version` is enough to do that despite doing so little, because ES module
# imports are hoisted: reaching the version branch at all means the entire
# server import graph resolved. A release that genuinely started importing
# @self-review/react at runtime would fail here with MODULE_NOT_FOUND, turning
# the override into a red base build instead of a VM whose review command is
# quietly broken.
#
# It checks the VERSION, not just the exit status, so a stale binary left by a
# failed upgrade cannot pass as a successful install.
#
# What this does NOT prove is that the server serves; that needs a listening
# socket and an HTTP request, which is the `sand land --review` end-to-end
# step in .github/workflows/test.yml.
- name: Verify the review tool runs and is the pinned release
  ansible.builtin.command:
    cmd: self-review-serve --version
  register: selfreview_check
  changed_when: false
  failed_when: >-
    selfreview_check.rc != 0
    or selfreview_version not in (selfreview_check.stdout | default('') ~ selfreview_check.stderr | default(''))
