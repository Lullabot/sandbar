---
# The pinned upstream release of @self-review/serve. It is a variable rather
# than a literal in tasks/main.yml so Renovate can bump one line (see the
# regex manager in renovate.json) and so a base can be built against a
# different release without editing the role.
#
# The template uses this ONE value twice: for @self-review/serve itself and
# for the @self-review/types release that stands in for its unused
# @self-review/react dependency (see tasks/main.yml). That is correct rather
# than lazy — every @self-review/* package is published in lockstep at the
# same version, so a single pin is what keeps the substitute in step with the
# thing it substitutes for.
selfreview_version: "1.45.0"

# selfreview_install_dir is the ONE fixed, predictable guest path the review
# tool is installed into. Nothing outside this role depends on it — the CLI is
# reached through selfreview_bin_dir, on PATH — so unlike its predecessor this
# path is genuinely local to the role and safe to change.
selfreview_install_dir: /opt/sandbar/self-review

# The apt packages the review workflow needs beyond the npm install.
#
# libxml2-utils is the Debian package that provides `xmllint` — the binary
# name is not a package name, which is the trap this variable exists to spell
# out once.
#
# It is here for the SKILLS, not for human convenience: all three of them
# shell out to `xmllint --schema <skill>/assets/*.xsd <file> --noout` to
# validate the XML they produce, and every one of them degrades to "warn the
# user and continue without validation" when the binary is missing. That
# degradation is silent enough to be worse than a failure — an invalid
# review.xml reaches the assistant that has to act on it.
#
# It lives here, beside the pin, rather than in roles/base's aggregated
# package transaction, because it and the review tool rise and fall together:
# whoever removes this role should not have to find a package name in another
# role's list to finish the job. The cost is one extra apt transaction per
# BASE build — not per VM, since the whole role is gated to the base phase in
# site.yml.
selfreview_packages:
  - libxml2-utils

# The assistant skills that close the review loop, staged into the base image
# here and copied into a checkout by self-review-install-skills. The project
# role calls that command for sand's initial clone; users can call it for any
# repository they clone later.
#
#   self-review-critique  pre-generates a review to curate (and runs the
#                         guide skill as its first step)
#   self-review-guide     writes the review.guide.xml walkthrough sidecar
#   self-review-apply     reads a finished review.xml and executes the changes
#
# They are NOT published to npm — they live only in upstream's git repository
# under .agents/skills/ — which is why they are fetched rather than declared
# as a dependency beside @self-review/serve.
selfreview_skills:
  - self-review-apply
  - self-review-critique
  - self-review-guide

# Where the skills are staged in the base image. Root-owned and read-only to
# the user: a checkout gets its own copy, and this is the pristine source that
# copy is made from, so a guest that has mangled one checkout's skills still
# has an intact one to install into the next.
selfreview_skills_dir: /opt/sandbar/self-review/skills

# Where the reusable checkout installer is placed. It also updates the user's
# active global excludes file, so installing into a later clone is the whole
# setup operation rather than half of one.
selfreview_skills_installer: /usr/local/bin/self-review-install-skills

# The skills are per-checkout by necessity, not by preference. Upstream's own
# issue #162, "Allow skills to be installed globally", is open, and the skills
# themselves hard-code checkout-relative asset paths.
#
# In particular, they use `xmllint --schema
# .agents/skills/self-review-apply/assets/self-review-v3.xsd` — so a
# guest-wide install would break their own instructions.

# Where the CLI is linked so every login shell finds it. internal/landreview
# runs it by BARE NAME (landreview.ServeBinary), so what matters is that it is
# on the default PATH, not where it physically lives.
selfreview_bin_dir: /usr/local/bin
