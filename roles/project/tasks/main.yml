---
- name: Set up the initial project clone
  when: project_clone_url | length > 0
  block:
    - name: Get home directory for {{ user_name }}
      ansible.builtin.getent:
        database: passwd
        key: "{{ user_name }}"

    - name: Set home directory fact
      ansible.builtin.set_fact:
        user_home: "{{ ansible_facts.getent_passwd[user_name][4] }}"

    # Turn https://github.com/org/repo(.git) into host=github.com,
    # relpath=org/repo, so the checkout mirrors the URL under ~/<host>/. Strip any
    # trailing slash(es) before .git: a URL like .../org/repo/ would otherwise
    # leave relpath="org/repo/", whose dirname is "org/repo" — collapsing the org
    # directory onto the clone destination so "Create the org directory" creates
    # the exact path git clone then refuses ("destination path already exists").
    - name: Parse the clone URL
      ansible.builtin.set_fact:
        _clone_host: "{{ project_clone_url | regex_replace('^[a-zA-Z]+://', '') | regex_replace('/.*$', '') }}"
        _clone_relpath: "{{ project_clone_url | regex_replace('^[a-zA-Z]+://[^/]+/', '') | regex_replace('/+$', '') | regex_replace('\\.git$', '') }}"

    - name: Derive the org directory and clone destination
      ansible.builtin.set_fact:
        _clone_org_dir: "{{ user_home }}/{{ _clone_host }}/{{ _clone_relpath | dirname }}"
        _clone_dest: "{{ user_home }}/{{ _clone_host }}/{{ _clone_relpath }}"

    - name: Create the org directory
      ansible.builtin.file:
        path: "{{ _clone_org_dir }}"
        state: directory
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: "0755"

    # GitHub convention: GH_TOKEN in a per-org .env, loaded by direnv. The
    # gitconfig credential helper (gh) reads GH_TOKEN so HTTPS auth just works.
    - name: Write the per-org .env with GH_TOKEN (GitHub only)
      ansible.builtin.copy:
        dest: "{{ _clone_org_dir }}/.env"
        content: "GH_TOKEN={{ project_clone_token }}\n"
        owner: "{{ user_name }}"
        group: "{{ user_name }}"
        mode: "0600"
      no_log: true
      when:
        - project_clone_token | length > 0
        - _clone_host == "github.com"

    - name: Approve the .env with direnv
      ansible.builtin.command:
        cmd: direnv allow {{ _clone_org_dir }}
      become: true
      become_user: "{{ user_name }}"
      environment:
        HOME: "{{ user_home }}"
      changed_when: true
      when:
        - project_clone_token | length > 0
        - _clone_host == "github.com"

    - name: Clone the project with a safe failure reason
      block:
        - name: Clone the project
          ansible.builtin.git:
            repo: "{{ project_clone_url }}"
            dest: "{{ _clone_dest }}"
            update: false
          become: true
          become_user: "{{ user_name }}"
          environment:
            HOME: "{{ user_home }}"
            GH_TOKEN: "{{ project_clone_token if _clone_host == 'github.com' else '' }}"
            GIT_TERMINAL_PROMPT: "0"
          # Git can echo credentials in its error. Keep the raw result out of
          # the log, then report only a fixed, credential-free reason below.
          no_log: "{{ project_clone_token | length > 0 }}"
      rescue:
        - name: Classify the clone failure without logging Git output
          ansible.builtin.set_fact:
            _clone_failure: "{{ ((ansible_failed_result.msg | default('')) ~ ' ' ~ (ansible_failed_result.stderr | default(''))) | lower }}"
          no_log: true

        - name: Report rejected clone credentials
          ansible.builtin.fail:
            msg: "SAND_CLONE_ERROR_AUTH: Git authentication failed. Check the clone token and its repository access."
          when: "'authentication failed' in _clone_failure or 'invalid username or password' in _clone_failure or 'bad credentials' in _clone_failure"

        - name: Report a missing or inaccessible repository
          ansible.builtin.fail:
            msg: "SAND_CLONE_ERROR_REPO: Repository not found or inaccessible. Check the clone URL and token access."
          when: "'repository not found' in _clone_failure or 'not found' in _clone_failure"

        - name: Report a clone network failure
          ansible.builtin.fail:
            msg: "SAND_CLONE_ERROR_NETWORK: Cannot reach the repository host. Check the clone URL and network access."
          when: "'could not resolve host' in _clone_failure or 'unable to access' in _clone_failure or 'could not resolve proxy' in _clone_failure"

        - name: Report another clone failure
          ansible.builtin.fail:
            msg: "SAND_CLONE_ERROR_OTHER: Project clone failed. Check the clone URL, token access, and the VM log."

    # This happens before the user starts their first agent session, so the
    # skills are discoverable for a critique that precedes the browser review.
    # The command also installs the global Git excludes and is left on PATH for
    # any repositories the user clones later.
    - name: Install the self-review skills into the project
      ansible.builtin.command:
        argv:
          - self-review-install-skills
          - "{{ _clone_dest }}"
      become: true
      become_user: "{{ user_name }}"
      environment:
        HOME: "{{ user_home }}"
      register: project_review_skills
      changed_when: "'installed=' in project_review_skills.stdout"
